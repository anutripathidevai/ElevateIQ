# Build the container from the repo Dockerfile and deploy to Azure Container Apps.
#
# Required GitHub secrets (Repo → Settings → Secrets and variables → Actions):
#   AZURE_CREDENTIALS  - output of:
#       az ad sp create-for-rbac --name interviewprep-ci --role contributor \
#         --scopes /subscriptions/<sub-id>/resourceGroups/rg-interviewprep --sdk-auth
#   ACR_NAME           - your Azure Container Registry name (without .azurecr.io)
#
# Required GitHub variables (same page → Variables tab):
#   RESOURCE_GROUP     - e.g. rg-interviewprep
#   CONTAINER_APP      - e.g. interviewprep
#
# App settings (DATABASE_URL, AZURE_OPENAI_*, AUTH_SECRET, OAuth, etc.) are
# configured once on the Container App itself — not here.
name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build image in ACR and deploy to Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          acrName: ${{ secrets.ACR_NAME }}
          containerAppName: ${{ vars.CONTAINER_APP }}
          resourceGroup: ${{ vars.RESOURCE_GROUP }}
          imageToBuild: ${{ secrets.ACR_NAME }}.azurecr.io/interviewprep:${{ github.sha }}
          dockerfilePath: Dockerfile
          targetPort: 3000
          ingress: external
